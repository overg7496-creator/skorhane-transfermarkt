name: SkorHane Yeni Kadro Oyuncu Detayları

on:
  # Bu iş akışını eklediğimiz commit ile ilk detay yenilemesini başlat.
  push:
    paths:
      - ".github/workflows/refresh-imported-player-details.yml"
  # Eksik lig kadroları başarıyla aktarıldığında yeni oyuncuların detaylarını da yenile.
  workflow_run:
    workflows:
      - "SkorHane Eksik Ligler — Paralel Takım ve Kadro Aktarımı"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Ana Transfermarkt yenilemesiyle aynı grup: istekler birbirine binmesin.
concurrency:
  group: skorhane-transfermarkt-sync
  cancel-in-progress: false

jobs:
  refresh-player-details:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate detail worker and tests
        run: |
          python -m py_compile sync/sync_transfermarkt.py sync/sync_squads_and_clubs.py
          python -m unittest discover -s tests -v

      - name: Start dedicated Transfermarkt API (v5.0.0)
        env:
          RATE_LIMITING_ENABLE: "false"
          TFMKT_MAX_CONCURRENCY: "1"
          TFMKT_TIMEOUT_SECONDS: "30"
          CACHE_TTL_SECONDS: "600"
        run: |
          python -m pip install --upgrade uv
          git clone --depth 1 --branch v5.0.0 https://github.com/felipeall/transfermarkt-api.git "$RUNNER_TEMP/transfermarkt-api"
          cd "$RUNNER_TEMP/transfermarkt-api"
          uv sync --extra server --no-dev
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/transfermarkt-api.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/transfermarkt-api.log"
            echo "Transfermarkt API 90 saniye içinde başlamadı."
            exit 1
          fi
          echo "Özel Transfermarkt API hazır (v5.0.0, eşzamanlı upstream isteği=1)."

      - name: Refresh all pending player details
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FELIPE_API_BASE: http://127.0.0.1:8000
          TM_SEASON: "2026"
          TM_MAX_PLAYERS_PER_RUN: "80"
          TM_DETAIL_MAX_RUNTIME_SECONDS: "20400"
          FELIPE_DELAY_MIN_SECONDS: "5.5"
          FELIPE_DELAY_MAX_SECONDS: "7.0"
          TM_MAX_MATCH_PAGES: "5"
          HTTP_MAX_RETRIES: "4"
          HTTP_TIMEOUT_SECONDS: "45"
        run: python sync/sync_transfermarkt.py refresh-details
