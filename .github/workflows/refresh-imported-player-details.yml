name: SkorHane Yeni Kadro Oyuncu Detayları

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      seen_after:
        description: "Kadro aktarımının başlangıç zamanı (ISO 8601 UTC)"
        required: false
        type: string
        default: ""
      seen_before:
        description: "Bitiş zamanı (ISO 8601 UTC). İki sınır verilirse yalnızca o aktarım penceresi."
        required: false
        type: string
        default: ""
      competition_id:
        description: "ALL seçilirse 9 lig çalışır; tek lig seçilirse yalnızca o lig. Her lig 5 takım grubuna ayrılır."
        required: false
        type: choice
        options:
          - ALL
          - TR1
          - TR2
          - TR3A
          - TR3B
          - GB1
          - ES1
          - L1
          - IT1
          - FR1
        default: ALL
      worker_shard:
        description: "ALL beş takım grubunu çalıştırır; 1-5 seçimi yalnızca o grubu devam ettirir."
        required: false
        type: choice
        options:
          - ALL
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
        default: ALL
  push:
    branches: [main]
    paths:
      - "database/015_five_team_detail_workers.sql"
      - "database/016_latest_season_detail_workers.sql"
      - "database/017_detail_worker_candidate_cache.sql"
      - ".github/workflows/refresh-imported-player-details.yml"

permissions:
  contents: read
  actions: write

# The matrix runs five disjoint team shards for each of the nine leagues (45 workers).
# Each player is assigned to exactly one league+club shard; hourly sweeps retry unfinished details.
jobs:
  prepare-detail-worker-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh indexed current-season worker cache once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          response="$(curl --fail-with-body --silent --show-error --max-time 120 \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL%/}/rest/v1/rpc/tm_refresh_detail_preseed_candidates_cache")"
          echo "Güncel oyuncu işçi önbelleği yenilendi: $response"

  refresh-player-details:
    needs: prepare-detail-worker-cache
    strategy:
      fail-fast: false
      # The indexed worker cache makes the cohort lookup lightweight; keep all 45 league/shard workers eligible to run together.
      max-parallel: 45
      matrix:
        competition_id: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["TR1","TR2","TR3A","TR3B","GB1","ES1","L1","IT1","FR1"]' || ((inputs.seen_after != '' || inputs.seen_before != '') && '["TR1"]') || (inputs.competition_id == 'ALL' && '["TR1","TR2","TR3A","TR3B","GB1","ES1","L1","IT1","FR1"]') || format('["{0}"]', inputs.competition_id)) }}
        worker_shard: ${{ fromJSON((inputs.seen_after != '' || inputs.seen_before != '') && '[1]' || ((github.event_name != 'workflow_dispatch' || inputs.worker_shard == 'ALL') && '[1,2,3,4,5]') || format('[{0}]', inputs.worker_shard)) }}
    concurrency:
      group: skorhane-imported-player-details-${{ matrix.competition_id }}-shard-${{ matrix.worker_shard }}
      # A newer run replaces an older job for the same league/shard, releasing stale shard locks.
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate detail worker and tests
        run: |
          python -m py_compile sync/sync_transfermarkt.py sync/sync_squads_and_clubs.py
          python -m unittest discover -s tests -v

      - name: Start dedicated Transfermarkt API (v5.0.0)
        env:
          RATE_LIMITING_ENABLE: "false"
          TFMKT_MAX_CONCURRENCY: "1"
          TFMKT_TIMEOUT_SECONDS: "30"
          CACHE_TTL_SECONDS: "600"
        run: |
          python -m pip install --upgrade uv
          git clone --depth 1 --branch v5.0.0 https://github.com/felipeall/transfermarkt-api.git "$RUNNER_TEMP/transfermarkt-api"
          cd "$RUNNER_TEMP/transfermarkt-api"
          uv sync --extra server --no-dev
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/transfermarkt-api.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/transfermarkt-api.log"
            echo "Transfermarkt API 90 saniye içinde başlamadı."
            exit 1
          fi
          echo "Özel Transfermarkt API hazır (v5.0.0, eşzamanlı upstream isteği=1)."

      - name: Refresh only the imported squad cohort
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          FELIPE_API_BASE: http://127.0.0.1:8000
          TM_SEASON: "2026"
          TM_MAX_PLAYERS_PER_RUN: "80"
          TM_DETAIL_PRESEED_ALL_HISTORY: "true"
          TM_DETAIL_COMPETITION_ID: ${{ matrix.competition_id }}
          TM_DETAIL_WORKER_SHARD: ${{ matrix.worker_shard }}
          TM_DETAIL_MAX_RUNTIME_SECONDS: "14400"
          TM_DETAIL_CONTINUATION_WORKFLOW: refresh-imported-player-details.yml
          FELIPE_DELAY_MIN_SECONDS: "8.0"
          FELIPE_DELAY_MAX_SECONDS: "9.5"
          TM_MAX_MATCH_PAGES: "5"
          HTTP_MAX_RETRIES: "4"
          HTTP_TIMEOUT_SECONDS: "45"
          TM_DETAIL_SQUAD_SEEN_AFTER: ${{ github.event.inputs.seen_after }}
          TM_DETAIL_SQUAD_SEEN_BEFORE: ${{ github.event.inputs.seen_before }}
        run: |
          echo "Yeni kadro oyuncuları zaman aralığı: $TM_DETAIL_SQUAD_SEEN_AFTER - $TM_DETAIL_SQUAD_SEEN_BEFORE"
          python sync/sync_transfermarkt.py refresh-imported-details
