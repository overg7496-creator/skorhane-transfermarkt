name: SkorHane Transfermarkt Tek Oyuncu Yenileme

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Çalıştırma modu"
        required: true
        type: choice
        options:
          - refresh-player-missing
          - one-player-test
          - preseed-players
        default: refresh-player-missing
      player_id:
        description: "Tek Transfermarkt oyuncu ID'si (ör. Victor Osimhen: 401923)"
        required: false
        type: string
      player_ids:
        description: "Ön doldurma için oyuncu ID listesi (virgül, boşluk veya noktalı virgül)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Same player is serialized; different player IDs remain independent.
  group: skorhane-transfermarkt-${{ github.event.inputs.player_ids || github.event.inputs.player_id || github.run_id }}
  cancel-in-progress: false

jobs:
  refresh-player:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TM_TEST_PLAYER_ID: ${{ github.event.inputs.player_id }}
      TM_PRESEED_PLAYER_IDS: ${{ github.event.inputs.player_ids }}
      TM_PRESEED_MAX_PLAYERS: "20"
      FELIPE_API_BASE: http://127.0.0.1:8000
      HTTP_MAX_RETRIES: "4"
      HTTP_TIMEOUT_SECONDS: "45"
      # Small spacing between local API calls; upstream concurrency remains 1.
      FELIPE_DELAY_MIN_SECONDS: "0.8"
      FELIPE_DELAY_MAX_SECONDS: "1.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python, tests and Worker syntax
        run: |
          set -euo pipefail
          python -m py_compile sync/sync_transfermarkt.py sync/sync_squads_and_clubs.py
          python -m unittest discover -s tests -v
          node --input-type=module --check < SkorHane-Worker.js

      - name: Cache Felipe API uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-felipe-transfermarkt-api-v5.0.0-uv
          restore-keys: |
            ${{ runner.os }}-felipe-transfermarkt-api-v5.0.0-

      - name: Start dedicated Felipe Transfermarkt API v5.0.0
        env:
          RATE_LIMITING_ENABLE: "false"
          TFMKT_MAX_CONCURRENCY: "1"
          TFMKT_TIMEOUT_SECONDS: "30"
          CACHE_TTL_SECONDS: "600"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-warn-script-location uv
          git clone --quiet --depth 1 --branch v5.0.0 https://github.com/felipeall/transfermarkt-api.git "$RUNNER_TEMP/transfermarkt-api"
          cd "$RUNNER_TEMP/transfermarkt-api"
          uv sync --extra server --no-dev
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/transfermarkt-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/transfermarkt-api.pid"
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/transfermarkt-api.log"
            echo "Felipe API 90 saniye içinde başlamadı."
            exit 1
          fi
          echo "Yerel Felipe API hazır; upstream eşzamanlılığı 1."

      - name: Refresh only missing or stale fields for this player
        if: github.event.inputs.mode == 'refresh-player-missing'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync/sync_transfermarkt.py refresh-player-missing

      - name: Full one-player integration test
        if: github.event.inputs.mode == 'one-player-test'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync/sync_transfermarkt.py one-player-test

      - name: Pre-seed selected players
        if: github.event.inputs.mode == 'preseed-players'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TM_PRESEED_PLAYER_IDS: ${{ github.event.inputs.player_ids }}
          TM_PRESEED_MAX_PLAYERS: "20"
        run: python sync/sync_transfermarkt.py preseed-players --player-ids "$TM_PRESEED_PLAYER_IDS"

      - name: Verify persisted player details in Supabase
        if: github.event.inputs.mode == 'refresh-player-missing' || github.event.inputs.mode == 'one-player-test'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          player_id = os.environ['TM_TEST_PLAYER_ID']
          headers = {'apikey': key, 'Authorization': f'Bearer {key}', 'Accept': 'application/json'}

          def get_rows(path):
              request = Request(f'{base}/rest/v1/{path}', headers=headers)
              with urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode('utf-8'))
              if not isinstance(result, list):
                  raise RuntimeError(f'Supabase beklenmeyen yanıt verdi: {path}')
              return result

          pid = quote(player_id, safe='')
          players = get_rows(f'tm_players?select=tm_id,name,current_market_value_eur,current_market_value_text,profile_payload,stats_payload,market_value_payload,transfers_payload,injuries_payload,last_felipe_synced_at&tm_id=eq.{pid}&limit=1')
          if not players:
              raise SystemExit(f'Oyuncu Supabase tm_players tablosunda bulunamadı: {player_id}')
          player = players[0]

          def count_payload(payload, *keys):
              if not isinstance(payload, dict):
                  return 0
              for name in keys:
                  value = payload.get(name)
                  if isinstance(value, list):
                      return len(value)
              return 0

          stats = get_rows(f'tm_player_season_stats?select=season_id,competition_name,club_name,goals_conceded,clean_sheets&tm_id=eq.{pid}&limit=1000')
          transfers = get_rows(f'tm_transfers?select=transfer_date,from_club,to_club,fee_text,fee_eur&tm_id=eq.{pid}&limit=1000')
          values = get_rows(f'tm_market_values?select=valuation_date,value_eur,display_value,club_name&tm_id=eq.{pid}&limit=1000')
          print(f"Oyuncu: {player.get('name')} | Transfermarkt ID: {player_id}")
          print(f"Son senkronizasyon: {player.get('last_felipe_synced_at') or 'henüz yok'}")
          print(f"Güncel piyasa değeri: {player.get('current_market_value_text') or player.get('current_market_value_eur') or 'Kaynak değer sunmadı'}")
          print(f"Sezon istatistik satırı: {len(stats)} | Ham stats: {count_payload(player.get('stats_payload'), 'stats', 'data', 'items')}")
          print(f"Piyasa değeri geçmişi: DB={len(values)} | Ham={count_payload(player.get('market_value_payload'), 'marketValueHistory', 'market_value_history', 'history', 'marketValues', 'valuations')}")
          print(f"Transfer geçmişi: DB={len(transfers)} | Ham={count_payload(player.get('transfers_payload'), 'transfers', 'history', 'items', 'data')}")
          print(f"Sakatlık geçmişi: Ham={count_payload(player.get('injuries_payload'), 'injuries', 'data', 'items')}")
          print('Not: Sıfır satır, sağlayıcının bu oyuncu için kayıt sunmadığı doğrulanmış boş sonuç olabilir; sahte veri eklenmez.')
          PY

      - name: Stop local API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/transfermarkt-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/transfermarkt-api.pid")" 2>/dev/null || true
          fi

