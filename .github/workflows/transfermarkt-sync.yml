
name: SkorHane Transfermarkt Sync

on:
  push:
    paths:
      - "sync/sync_transfermarkt.py"
      - "tests/**"
  schedule:
    - cron: "20 3 * * 1,4"
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Çalıştırma modu"
        required: true
        type: choice
        options:
          - import-squads
          - refresh-details
          - one-player-test
          - sync
          - seed-history
        default: sync
      player_id:
        description: "Test edilecek oyuncunun Transfermarkt ID'si"
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: skorhane-transfermarkt-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ github.event.inputs.mode }}" = "seed-history" ]; then
            python -m pip install "git+https://github.com/dcaribou/transfermarkt-scraper.git"
          fi

      - name: Validate Python, tests and Worker syntax
        run: |
          python -m py_compile sync/sync_transfermarkt.py
          python -m unittest discover -s tests -v
          node --input-type=module --check < SkorHane-Worker.js

      - name: Check resumable player detail queue
        id: detail_queue
        if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync/sync_transfermarkt.py has-pending-details

      - name: Start dedicated Transfermarkt API (v5.0.0)
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'schedule' &&
           github.event.schedule == '20 3 * * 1,4' &&
           vars.ENABLE_TRANSFERMARKT_CRON == 'true') ||
          (github.event_name == 'schedule' &&
           github.event.schedule == '*/15 * * * *' &&
           steps.detail_queue.outputs.has_pending == 'true') ||
          (github.event_name == 'workflow_dispatch' &&
           (github.event.inputs.mode == 'sync' ||
            github.event.inputs.mode == 'refresh-details' ||
            github.event.inputs.mode == 'one-player-test'))
        env:
          RATE_LIMITING_ENABLE: "false"
          TFMKT_MAX_CONCURRENCY: "1"
          TFMKT_TIMEOUT_SECONDS: "30"
          CACHE_TTL_SECONDS: "600"
        run: |
          python -m pip install --upgrade uv
          git clone --depth 1 --branch v5.0.0 https://github.com/felipeall/transfermarkt-api.git "$RUNNER_TEMP/transfermarkt-api"
          cd "$RUNNER_TEMP/transfermarkt-api"
          uv sync --extra server --no-dev
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/transfermarkt-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/transfermarkt-api.pid"
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/transfermarkt-api.log"
            echo "Kendi Transfermarkt API sunucumuz 90 saniye içinde başlamadı."
            exit 1
          fi
          echo "Özel Transfermarkt API hazır (v5.0.0, eşzamanlı upstream isteği=1)."

      - name: Live smoke-test Transfermarkt player endpoints
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          base = "http://127.0.0.1:8000/players/418560"
          checks = [
              ("/profile", "name"),
              ("/market_value", "marketValueHistory"),
              ("/transfers", "transfers"),
              ("/stats", "stats"),
              ("/injuries?page_number=1", "injuries"),
              ("/absences?page_number=1", "absences"),
              ("/matches?season_id=2026&page_number=1", "matches"),
          ]
          for index, (path, expected_key) in enumerate(checks, 1):
              if index > 1:
                  time.sleep(6)
              url = base + path
              try:
                  with urlopen(url, timeout=45) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                      if not isinstance(payload, dict) or expected_key not in payload:
                          raise RuntimeError(
                              f"{path}: geçersiz şema; beklenen alan '{expected_key}', "
                              f"gelen alanlar={list(payload) if isinstance(payload, dict) else type(payload).__name__}"
                          )
                      print(f"OK {index}/{len(checks)} {path}: HTTP {response.status}, alan={expected_key}")
              except HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:1200]
                  raise SystemExit(f"FAIL {path}: HTTP {exc.code}; yanıt={detail}") from exc
              except (URLError, TimeoutError, json.JSONDecodeError, RuntimeError) as exc:
                  raise SystemExit(f"FAIL {path}: {exc}") from exc
          print("Tüm Transfermarkt oyuncu uç noktaları canlı kontrolden geçti.")
          PY

      - name: Run current sync
        if: (github.event_name == 'schedule' && github.event.schedule == '20 3 * * 1,4' && vars.ENABLE_TRANSFERMARKT_CRON == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'sync')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FELIPE_API_BASE: http://127.0.0.1:8000
          TM_LEAGUES: TR1,TR2,TR3,TR4,GB1,ES1,L1,IT1,FR1
          TM_SEASON: "2026"
          TM_APIFY_MAX_PLAYERS: "20000"
          REQUEST_DELAY_MIN_SECONDS: "1.5"
          REQUEST_DELAY_MAX_SECONDS: "3.5"
          FELIPE_DELAY_MIN_SECONDS: "5.5"
          FELIPE_DELAY_MAX_SECONDS: "7.0"
          TM_MAX_PLAYERS_PER_RUN: "80"
          TM_MAX_MATCH_PAGES: "5"
          HTTP_MAX_RETRIES: "4"
          HTTP_TIMEOUT_SECONDS: "45"
        run: python sync/sync_transfermarkt.py sync

      - name: Refresh player detail data
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'refresh-details') || (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' && steps.detail_queue.outputs.has_pending == 'true')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FELIPE_API_BASE: http://127.0.0.1:8000
          TM_MAX_PLAYERS_PER_RUN: "80"
          TM_DETAIL_MAX_RUNTIME_SECONDS: "20400"
          FELIPE_DELAY_MIN_SECONDS: "5.5"
          FELIPE_DELAY_MAX_SECONDS: "7.0"
          TM_MAX_MATCH_PAGES: "5"
          HTTP_MAX_RETRIES: "4"
          HTTP_TIMEOUT_SECONDS: "45"
        run: python sync/sync_transfermarkt.py refresh-details

      - name: Run historical seed
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'seed-history'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DCARIBOU_COMPETITIONS: TR1,GB1,ES1,L1,IT1,FR1
          DCARIBOU_SEASONS: "2022,2023,2024,2025"
          DCARIBOU_APPEARANCE_BATCH_SIZE: "25"
          TM_SEASON: "2026"
          REQUEST_DELAY_MIN_SECONDS: "1.5"
          REQUEST_DELAY_MAX_SECONDS: "3.5"
        run: python sync/sync_transfermarkt.py seed-history

      - name: Import current squads
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'import-squads'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TM_LEAGUES: TR1,TR2,TR3,TR4,GB1,ES1,L1,IT1,FR1
          TM_SEASON: "2026"
          TM_APIFY_MAX_PLAYERS: "20000"
          REQUEST_DELAY_MIN_SECONDS: "1.5"
          REQUEST_DELAY_MAX_SECONDS: "3.5"
        run: python sync/sync_transfermarkt.py import-squads

      - name: Test one player
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'one-player-test'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TM_TEST_PLAYER_ID: ${{ github.event.inputs.player_id }}
          FELIPE_API_BASE: http://127.0.0.1:8000
          FELIPE_DELAY_MIN_SECONDS: "5.5"
          FELIPE_DELAY_MAX_SECONDS: "7.0"
          HTTP_MAX_RETRIES: "4"
          HTTP_TIMEOUT_SECONDS: "45"
        run: python sync/sync_transfermarkt.py one-player-test
