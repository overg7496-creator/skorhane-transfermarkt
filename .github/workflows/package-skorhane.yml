name: Build SkorHane HTML and Worker ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Worker syntax
        run: node --input-type=module --check < SkorHane-Worker.js

      - name: Build ZIP
        run: |
          mkdir -p package
          cp SkorHane-HTML-kodu-kopyalanabilir.txt package/SkorHane-HTML.html
          cp SkorHane-HTML-kodu-kopyalanabilir.txt package/SkorHane-HTML-kodu-kopyalanabilir.txt
          cp SkorHane-Worker.js package/SkorHane-Worker.js
          cp SkorHane-Worker.js package/SkorHane-Worker-kodu-kopyalanabilir.txt
          cat > package/KURULUM.txt <<'EOF'
          SKORHANE GUNCEL PAKET

          1) SkorHane-HTML.html: mevcut uygulamadaki HTML dosyasinin yerine kullan.
          2) SkorHane-Worker.js: Cloudflare Worker'a yapistirip Deploy et.
          3) Worker kodunu kopyalamak icin SkorHane-Worker-kodu-kopyalanabilir.txt dosyasini kullanabilirsin.
          4) Worker.js ve kopyalanabilir TXT dosyasinin icerigi aynidir.

          NOT: Bir oyuncunun eksik Transfermarkt alanlarini yenilemek icin GitHub Actions
          ekraninda 'SkorHane Transfermarkt Tek Oyuncu Yenileme' workflow'unu ac,
          'refresh-player-missing' modunu sec ve player_id alanina Transfermarkt ID'sini gir.
          EOF
          cd package
          zip -q -j ../SkorHane-Guncel.zip SkorHane-HTML.html SkorHane-HTML-kodu-kopyalanabilir.txt SkorHane-Worker.js SkorHane-Worker-kodu-kopyalanabilir.txt KURULUM.txt

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkorHane-Guncel
          path: SkorHane-Guncel.zip
          if-no-files-found: error
          retention-days: 30
