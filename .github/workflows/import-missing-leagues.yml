name: SkorHane — Lig, Kadro ve Geçmiş Sezon Ön-Doldurma

on:
  workflow_dispatch:
    inputs:
      tm_leagues:
        description: "Transfermarkt lig kodları; TFF 3. Lig grupları TR4A/TR4B/TR4C dahildir. Ek lig kodlarını virgülle ekleyebilirsin."
        required: true
        type: string
        default: "TR1,TR2,TR3A,TR3B,TR4A,TR4B,TR4C,GB1,ES1,L1,IT1,FR1"
      tm_seasons:
        description: "Sezon başlangıç yılları; güncel sezon önce, geçmiş sezonlar sonra."
        required: true
        type: string
        default: "2026,2025,2024,2023,2022"
      continue_count:
        description: "Otomatik devam sayacı. Elle başlatırken 0 bırak."
        required: false
        type: string
        default: "0"

permissions:
  contents: read
  actions: write

concurrency:
  group: skorhane-transfermarkt-squad-preseed
  cancel-in-progress: false

jobs:
  import-missing-leagues:
    name: Transfermarkt lig/kadro/sezon batch aktarımı
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FELIPE_API_BASE: http://127.0.0.1:8000
      TM_LEAGUES: ${{ github.event.inputs.tm_leagues || 'TR1,TR2,TR3A,TR3B,TR4A,TR4B,TR4C,GB1,ES1,L1,IT1,FR1' }}
      TM_SEASONS: ${{ github.event.inputs.tm_seasons || '2026,2025,2024,2023,2022' }}
      TM_SEASON: "2026"
      TM_CONTINUE_COUNT: ${{ github.event.inputs.continue_count || '0' }}
      REQUEST_DELAY_MIN_SECONDS: "4.0"
      REQUEST_DELAY_MAX_SECONDS: "6.0"
      HTTP_MAX_RETRIES: "4"
      HTTP_TIMEOUT_SECONDS: "45"
      SQUAD_SYNC_MAX_RUNTIME_SECONDS: "20400"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sync code and tests
        run: |
          set -euo pipefail
          python -m py_compile sync/sync_transfermarkt.py sync/sync_squads_and_clubs.py
          python -m unittest discover -s tests -v

      - name: Start local Felipe Transfermarkt API v5.0.0
        env:
          RATE_LIMITING_ENABLE: "false"
          TFMKT_MAX_CONCURRENCY: "1"
          TFMKT_TIMEOUT_SECONDS: "30"
          CACHE_TTL_SECONDS: "600"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-warn-script-location uv
          git clone --quiet --depth 1 --branch v5.0.0 https://github.com/felipeall/transfermarkt-api.git "$RUNNER_TEMP/transfermarkt-api"
          cd "$RUNNER_TEMP/transfermarkt-api"
          uv sync --extra server --no-dev
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/transfermarkt-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/transfermarkt-api.pid"
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/transfermarkt-api.log"
            echo "Felipe API 90 saniye içinde başlamadı."
            exit 1
          fi
          echo "Felipe API hazır; upstream istekleri seri ve gecikmeli yürütülecek."

      - name: Capture squad-import start time
        id: import_window_start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Import leagues, team snapshots and historical squads
        run: python sync/sync_squads_and_clubs.py

      - name: Capture squad-import end time
        id: import_window_end
        run: echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Queue missing player details from this squad-import window
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SEEN_AFTER: ${{ steps.import_window_start.outputs.started_at }}
          SEEN_BEFORE: ${{ steps.import_window_end.outputs.finished_at }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ.get("GITHUB_REF_NAME", "main")
          body = {
              "ref": ref,
              "inputs": {
                  "seen_after": os.environ["SEEN_AFTER"],
                  "seen_before": os.environ["SEEN_BEFORE"],
              },
          }
          request = Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/refresh-imported-player-details.yml/dispatches",
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "SkorHane-Player-Preseed",
              },
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              print(f"Player detail pre-seed queued (HTTP {response.status}); window={body['inputs']}")
          PY

      - name: Stop local API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/transfermarkt-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/transfermarkt-api.pid")" 2>/dev/null || true
          fi
