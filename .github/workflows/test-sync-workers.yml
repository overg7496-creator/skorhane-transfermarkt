name: SkorHane Sync Worker Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sync/**"
      - "tests/**"
      - "database/**"
      - "SkorHane-Worker.js"
      - "SkorHane-Worker-kodu-kopyalanabilir.txt"
      - "SkorHane-HTML-kodu-kopyalanabilir.txt"
      - "SkorHane-HTML-kopyalanabilir.txt"
      - ".github/workflows/test-sync-workers.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python workers
        run: |
          set -euo pipefail
          python -m py_compile sync/sync_transfermarkt.py sync/sync_squads_and_clubs.py sync/sync_league_statistics.py
          python -m unittest discover -s tests -v
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          source = Path("SkorHane-HTML-kodu-kopyalanabilir.txt").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", source, flags=re.IGNORECASE)
          if not scripts:
              raise SystemExit("Ana HTML içinde JavaScript bloğu bulunamadı.")
          for index, script in enumerate(scripts, start=1):
              target = Path(f"/tmp/skorhane-inline-{index}.js")
              target.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(target)], check=True)
              print(f"HTML inline JavaScript {index}/{len(scripts)} syntax OK")
          PY
          node --check SkorHane-Worker.js
          cmp -s SkorHane-Worker.js SkorHane-Worker-kodu-kopyalanabilir.txt
