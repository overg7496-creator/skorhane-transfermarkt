name: SkorHane 2.402 Kuyruğunu Durdur

on:
  push:
    paths:
      - ".github/workflows/stop-2402-overlap.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel-overlapping-2402:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the old 2,402-player run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/45712306203/cancel"
          echo "Eski 2.402 oyunculuk çalışma iptal isteği gönderildi."
