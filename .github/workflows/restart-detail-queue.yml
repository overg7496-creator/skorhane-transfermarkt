name: Restart original player detail queue

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Stop stale main runs and dispatch corrected remaining-player queue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "transfermarkt-sync.yml";
            const activeStatuses = new Set(["queued", "in_progress", "pending", "waiting", "requested"]);

            async function activeMainRuns() {
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: "main", per_page: 100
              });
              return response.data.workflow_runs.filter(run =>
                run.id !== context.runId && activeStatuses.has(run.status)
              );
            }

            const staleRuns = await activeMainRuns();
            for (const run of staleRuns) {
              core.info(`Cancelling stale main run ${run.id} (${run.status})`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              } catch (error) {
                if (![409, 422].includes(error.status)) throw error;
                core.info(`Run ${run.id} changed state before cancellation: ${error.message}`);
              }
            }

            let remaining = [];
            for (let attempt = 0; attempt < 24; attempt++) {
              remaining = await activeMainRuns();
              if (remaining.length === 0) break;
              core.info(`Waiting for ${remaining.length} stale main run(s) to stop`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (remaining.length > 0) {
              throw new Error(`Main runs still active; refusing overlapping refresh: ${remaining.map(r => r.id).join(", ")}`);
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: "main",
              inputs: {
                mode: "refresh-details",
                seen_after: "2026-11-12T08:00:00Z",
                seen_before: "2026-11-25T20:26:06Z"
              }
            });
            core.info("Dispatched corrected main queue. It will process only players without last_felipe_synced_at.");
